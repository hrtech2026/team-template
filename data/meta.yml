# Метаданные команды
#
# Источник истины для агрегатора цифрового следа, витрины и настройки доски.
# Файл валидируется при каждом Pull Request.
#
# Порядок ключей менять не нужно — его читает человек при проверке заявки.

# --- Идентификация -----------------------------------------------------------
# Короткое имя латиницей, уникальное в организации. Совпадает с именем
# репозитория. Проставляется воркфлоу provision-team.yml из заявки команды,
# поэтому в эталоне стоит заведомо нерабочее значение.
id: team-template-00

# Отображаемое название команды. Показывается в витрине и на доске.
name: Название команды

# Трек. Одно из значений student.tracks в пульте.
track: onboarding

# --- Учебный контекст --------------------------------------------------------
# Номер группы определяет расписание защит, номер команды — имя репозитория.
group: ИП-000
number: "00"

# --- Связи -------------------------------------------------------------------
# Полное имя репозитория в формате org/repo. Заполняется при создании.
repo: YOUR_STUDENT_ORG/team-template-00

# --- Участники ---------------------------------------------------------------
# От 3 до 5 человек. Роли не повторяются более двух раз на человека.
# login обязателен и должен существовать в GitHub.
#
# Этот блок записывает воркфлоу provision-team.yml по заявке команды, вместе
# с правами на запись. Менять его вручную нельзя: права выдаются по заявке
# «Изменение состава», и расхождение между здесь и на GitHub не даст
# записать в репозиторий.
members:
  - login: captain_login
    name: Фамилия Капитан
    role: captain
  - login: analyst_login
    name: Фамилия Аналитик
    role: analyst
  - login: architect_login
    name: Фамилия Архитектор
    role: architect

# Допустимые роли: captain, analyst, architect, requirements, data_researcher.
# Обязательны: captain, analyst, architect.

# --- Контекст решения --------------------------------------------------------
# Заинтересованные стороны: роли, а не имена. Показываются на доске.
stakeholders:
  - Наставник отдела
  - HR-партнёр
  - Руководитель подразделения

# Концепт в двух предложениях. Публикуется в витрине. До 400 символов.
concept: >
  Сократить время адаптации нового сотрудника за счёт единой точки входа
  в базу знаний с учётом роли и автоматических напоминаний об этапах.

# --- Состояние ---------------------------------------------------------------
# Этап команды. Одно из значений: idea, as_is, to_be, requirements, defense.
# Значение соответствует колонкам доски Projects v2.
stage: idea

# Дата создания репозитория в формате YYYY-MM-DD.
created_at: 2026-09-26

# Внутренние заметки команды. В публичный контур не попадают:
# sanitize_registry.py исключает это поле.
internal_notes: >
  Что здесь можно писать: распределение ролей, договорённости, черновики,
  ссылки на обсуждения. Это поле никогда не публикуется.
